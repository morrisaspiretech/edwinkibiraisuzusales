name: Auto Blog Auto-Publisher

on:
  schedule:
    # Run daily at 6:00 AM UTC (9:00 AM Kenya time)
    - cron: '0 6 * * *'
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_blog_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install dotenv

      - name: Run Auto Blog Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node auto-blog-daemon.js --count=1

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add apps/website/src/data/posts.ts apps/website/src/app/sitemap.ts
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(blog): auto-publish daily SEO buyer guide [skip ci]"
            git push origin main
          else
            echo "No new blog posts generated."
          fi
